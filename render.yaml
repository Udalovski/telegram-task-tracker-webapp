services:
  - type: web
    name: task-tracker-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TIMEZONE
        value: Europe/Warsaw
      - key: DAILY_REPORT_TIME
        value: "20:00"
